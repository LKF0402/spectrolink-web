name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy>=1.24" > pip.log 2>&1 || { echo "::error::pip failed :: $(tail -3 pip.log | tr '\n' ' ' | cut -c1-300)"; exit 1; }

      - name: Bootstrap (upstream kernel + runtimes + line tables)
        run: |
          set +e
          python tools/bootstrap.py > boot.log 2>&1
          st=$?
          if [ $st -ne 0 ]; then
            python - <<'PY'
            import pathlib, re, sys
            txt = pathlib.Path("boot.log").read_text(errors="ignore")
            i = txt.find("[线表切片]")
            seg = txt[i:] if i >= 0 else txt[-3000:]
            # 只留关键行：异常类型、最后一行、以及 HTTP/URL/错误关键词
            lines = [l for l in seg.splitlines() if l.strip()]
            keep = [l for l in lines if any(k in l for k in (
                "Error", "error", "Exception", "不能", "无法", "Cannot", "HTTP", "403", "404",
                "Timeout", "timed out", "SSL", "urlopen", "hapi", "HAPI", "TIPS", "lbl", "api"))]
            body = " | ".join(keep[-12:]) or " | ".join(lines[-8:])
            print("::error::build_tables :: " + body[:1400])
            PY
            exit $st
          fi
          tail -6 boot.log

      - name: Verify browser kernel against CPython baseline
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "py"); sys.path.insert(0, "py/vendor")
          os.environ["SPECTROLINK_DATA_DIR"] = "data/tables"
          import web_api
          r = web_api.simulate_wms({"species": "CH4", "wn0": 6046.9636, "span": 0.6, "T": 296,
                                    "P": 1.01325, "x": 1e-4, "L": 50, "a": 0.08,
                                    "n_scan": 201, "n_mod": 96})
          assert r["ok"], r
          peak = r["meta"]["peak_2f"]
          baseline = 0.0026775647526798996
          rel = abs(peak - baseline) / baseline
          print(f"peak_2f={peak} rel_err={rel:.2e}")
          assert rel < 1e-6, "数值相对误差超限，内核或线表可能已漂移"
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
