name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Env probe
        run: |
          echo "## 00 环境" >> $GITHUB_STEP_SUMMARY
          { python -V; python -m pip -V; } 2>&1 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Install build dependency
        run: |
          echo "## 01 pip" >> $GITHUB_STEP_SUMMARY
          python -m pip install --disable-pip-version-check "numpy>=1.24" 2>&1 | tail -40 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Restore line tables
        run: |
          echo "## 02 线表还原" >> $GITHUB_STEP_SUMMARY
          python tools/restore_tables.py 2>&1 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Bootstrap
        run: |
          echo "## 03 bootstrap" >> $GITHUB_STEP_SUMMARY
          python tools/bootstrap.py --skip-tables 2>&1 | tail -40 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Check tables
        run: |
          echo "## 04 线表校验" >> $GITHUB_STEP_SUMMARY
          python tools/build_tables.py --check 2>&1 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Verify kernel baseline
        run: |
          echo "## 05 数值校验" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' 2>&1 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          import os, sys
          sys.path.insert(0, "py")
          sys.path.insert(0, "py/vendor")
          os.environ["SPECTROLINK_DATA_DIR"] = "data/tables"
          import web_api
          r = web_api.simulate_wms({"species": "CH4", "wn0": 6046.9636, "span": 0.6, "T": 296,
                                    "P": 1.01325, "x": 1e-4, "L": 50, "a": 0.08,
                                    "n_scan": 201, "n_mod": 96})
          assert r["ok"], r
          peak = r["meta"]["peak_2f"]
          baseline = 0.0026775647526798996
          rel = abs(peak - baseline) / baseline
          print(f"peak_2f={peak} rel_err={rel:.2e}")
          assert rel < 1e-6, "数值相对误差超限"
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
